<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeKhaFong Production — เช่ากล้อง เลนส์ และอุปกรณ์ถ่ายทำ</title>

    <!-- ==================== FAVICON (โลโก้บนแท็บเบราว์เซอร์) ==================== -->
    <link rel="icon" type="image/png" href="lekhaFongLogo.png">

    <!-- ==================== FRAMEWORKS & FONTS ==================== -->
    <!-- Tailwind CSS (รองรับ Modal Login/Signup เดิม และ Utility Classes) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: IBM Plex Sans Thai & Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons (สำหรับหน้า Login, Team และ Admin) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ==================== CUSTOM STYLES (ธีม UI ใหม่ + Layout เดิม) ==================== -->
    <style>
        /* ---------- ตัวแปรสีและฟอนต์หลักของเว็บไซต์ ---------- */
        :root {
            --bg: #FFF5F5;
            --blush: #F2D4CE;
            --rose: #D9B5BD;
            --ink: #4A4A4A;
            --ink-2: #6F6262;
            --paper: #FFFDFD;
            --line: #EBD3D1;
            --rose-deep: #A8727F;
            --accent: #BF4B72;
            --accent-d: #A63C61;
            --accent-soft: #F9E3EA;
            --tb: 0px;
            --serif: 'Newsreader', 'IBM Plex Sans Thai', Georgia, serif;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            margin: 0;
        }
        a { color: inherit; }
        button, input, select, textarea { font: inherit; color: inherit; }

        /* เอฟเฟกต์กระพริบของชื่อเว็บ (สำรองกรณี Tailwind ยังโหลดไม่เสร็จ) */
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
        .brand-pulse {
            animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* ---------- Utility & Typography ---------- */
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .serif { font-family: var(--serif); font-style: italic; font-weight: 400; }
        .serif em { font-style: normal; color: var(--rose-deep); }
        .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: inline-block; }
        .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
        .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; display: inline-block; }
        hr.dots { border: 0; border-top: 1px dotted var(--rose); margin: 20px 0; }

        /* ---------- Buttons ---------- */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; border: 1px solid transparent; border-radius: 999px; padding: 12px 22px; cursor: pointer; text-decoration: none; transition: background .2s, transform .2s, box-shadow .2s; white-space: nowrap; }
        .btn .ic { width: 18px; height: 18px; }
        .btn-ink { background: var(--ink); color: #fff; }
        .btn-ink:hover { background: #363636; }
        .btn-rose { background: var(--rose); color: var(--ink); }
        .btn-rose:hover { background: #cb9ea9; }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 12px 24px -14px rgba(191,75,114,.9); }
        .btn-accent:hover { background: var(--accent-d); }
        .btn-ghost { background: var(--paper); border-color: var(--rose); color: var(--ink); }
        .btn-ghost:hover { background: var(--blush); }
        .btn-sm { padding: 9px 18px; font-size: 14px; }
        .btn-lg { padding: 16px 30px; font-size: 16px; }
        .adv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; white-space: nowrap; }
        .site .adv-btn.open { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ---------- Site Shell & Navbar ---------- */
        .site { min-height: 100vh; display: flex; flex-direction: column; }
        .site > * { width: 100%; }
        .site main { flex: 1; }

        .nav { position: sticky; top: var(--tb); z-index: 40; background: rgba(255,245,245,.82); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-bottom: 1px solid rgba(235,211,209,.6); }
        .nav-in { max-width: 1160px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 24px; }
        .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 22px; letter-spacing: -.01em; cursor: pointer; }
        .logo img { width: 46px; height: 46px; object-fit: contain; display: inline-block; }
        .logo b { color: var(--rose-deep); font-weight: 700; }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .nav-links a { padding: 8px 14px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 15px; transition: color .2s, background .2s; white-space: nowrap; }
        .nav-links a:hover { color: var(--ink); }
        .nav-links a.on { color: var(--ink); font-weight: 600; }
        .nav .btn-accent { padding: 10px 20px; font-size: 14.5px; }

        .v-d { background: radial-gradient(75% 520px at 50% 0%, #F8DCD6 0%, rgba(255,245,245,0) 72%), var(--bg); }
        .dnav { position: sticky; top: 0; }
        .dnav .nav-in { display: flex; justify-content: center; position: relative; padding-top: 16px; }
        .dnav .dicons { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); display: flex; gap: 10px; align-items: center; }
        .dsub { padding: 2px 28px 12px; display: flex; justify-content: center; }
        .dsub .nav-links { flex-wrap: wrap; justify-content: center; margin: 0 auto; }
        .dnav .nav-links a.on { box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }

        /* ---------- Search Bar & Advance Search Panel ---------- */
        .searchwrap { position: relative; z-index: 5; }
        .sb-row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
        input::placeholder { color: #A99A9A; }

        .sb-d { justify-content: center; max-width: 1000px; margin: 36px auto 0; }
        .sb-d .sb { flex: 1; min-width: 300px; display: flex; align-items: stretch; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px; box-shadow: 0 34px 64px -30px rgba(120,70,85,.5); }
        .sb-seg { display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 6px 26px; flex: 0 1 180px; cursor: text; position: relative; }
        .sb-seg.grow { flex: 1 1 240px; }
        .sb-seg + .sb-seg::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 1px; background: var(--line); }
        .sb-seg span { font-size: 12px; font-weight: 600; color: var(--ink); }
        .sb-seg input { border: 0; outline: 0; background: transparent; font-size: 15px; color: var(--ink); padding: 0; width: 100%; }
        .sb-d .sb-go { border-radius: 999px; padding: 0 30px; font-weight: 600; font-size: 16px; }
        .sb-d .adv-btn { border-radius: 999px; background: var(--paper); color: var(--accent-d); border: 1.5px solid var(--accent); padding: 0 28px; box-shadow: 0 34px 64px -30px rgba(191,75,114,.45); }
        .sb-d .adv-btn:hover { background: var(--accent-soft); }

        .adv-panel { margin-top: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 26px 28px; box-shadow: 0 30px 60px -36px rgba(120,70,85,.35); text-align: left; }
        .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px 32px; }
        .adv-grid .t { display: block; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; font-weight: 500; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { font-size: 14px; border: 1px solid var(--rose); background: transparent; color: var(--ink); padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: background .2s; }
        .chip:hover { background: var(--blush); }
        .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
        .field { width: 100%; background: var(--paper); border: 1px solid var(--rose); border-radius: 10px; padding: 11px 14px; color: var(--ink); }
        .range-row { display: flex; align-items: center; gap: 12px; }
        input[type=range] { accent-color: var(--ink); width: 100%; }
        .range-val { font-family: var(--serif); font-style: italic; font-size: 18px; white-space: nowrap; }
        .checks { display: grid; gap: 8px; font-size: 15px; }
        .checks label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
        .checks input { accent-color: var(--ink); width: 17px; height: 17px; }
        .adv-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px dotted var(--rose); }

        /* ---------- Hero Banner ---------- */
        .hero { padding: 14px 0 0; }
        .hero .wrap, .hero .hero-wrap { width: 96%; max-width: 1800px; margin: 0 auto; padding: 0; }
        .v-a .banner {
            position: relative;
            border-radius: 36px;
            min-height: auto;
            padding: 54px max(48px, calc((100% - 1160px) / 2));
            background: radial-gradient(90% 100% at 100% 0%, rgba(255,245,245,.9) 0%, rgba(255,245,245,0) 55%), linear-gradient(135deg, #F2D4CE 0%, #D9B5BD 100%);
            overflow: hidden;
        }
        .v-a .banner::before, .v-a .banner::after { content: ""; position: absolute; border-radius: 50%; border: 1px dotted rgba(74,74,74,.32); pointer-events: none; }
        .v-a .banner::before { width: 520px; height: 520px; right: -60px; top: -180px; }
        .v-a .banner::after { width: 280px; height: 280px; left: -90px; bottom: -140px; }
        .banner-inner { width: 100%; position: relative; z-index: 1; }
        .banner-copy { max-width: 580px; }
        .v-a .banner h1 { font-size: clamp(46px, 6vw, 78px); line-height: 1.02; letter-spacing: -.02em; margin: 14px 0 18px; }
        .v-a .banner p { font-size: 18px; margin-bottom: 28px; color: #5b4f50; max-width: 460px; }
        .slide-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 32px; }
        .slide-tabs button { font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(74,74,74,.28); background: rgba(255,253,253,.35); cursor: pointer; transition: .2s; }
        .slide-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

        /* ---------- Sections & Product Cards ---------- */
        .sec { padding: 76px 0 0; }
        .sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
        .sec-head h2 { font-size: clamp(30px, 4vw, 48px); line-height: 1.06; letter-spacing: -.015em; margin-top: 8px; }
        .link-arrow { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; text-decoration: none; border-bottom: 1.5px solid var(--rose); padding-bottom: 2px; }
        .link-arrow .ic { width: 17px; height: 17px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 20px; }
        .v-d .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }

        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; transition: transform .25s, box-shadow .25s, border-color .25s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 26px 42px -28px rgba(120,70,85,.5); }
        .card-img { position: relative; aspect-ratio: 4/3.1; display: grid; place-items: center; color: var(--ink); }
        .card-img .ic { width: 64px; height: 64px; stroke-width: 1.05; }
        .t0 { background: linear-gradient(145deg, #FBE6E2, #F2D4CE); }
        .t1 { background: linear-gradient(145deg, #F2D4CE, #D9B5BD); }
        .t2 { background: linear-gradient(145deg, #FFEFED, #E8CBCF); }
        .badge { position: absolute; left: 14px; top: 14px; background: var(--accent); color: #fff; font-size: 12px; padding: 3px 11px; border-radius: 999px; font-weight: 500; }
        .fav { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,253,253,.85); display: grid; place-items: center; cursor: pointer; transition: background .2s; }
        .fav:hover { background: #fff; }
        .fav .ic { width: 18px; height: 18px; }
        .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .card-cat { font-size: 13px; color: var(--ink-2); }
        .card h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
        .card-spec { font-size: 14px; color: var(--ink-2); }
        .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 14px; }
        .price b { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 26px; }
        .price small { color: var(--ink-2); font-size: 13px; margin-left: 2px; }
        .go { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: background .2s, transform .2s; }
        .go:hover { background: var(--accent); transform: translateX(2px); }
        .go .ic { width: 18px; height: 18px; }
        .v-d .card { border: 0; border-radius: 32px; box-shadow: 0 24px 44px -32px rgba(120,70,85,.5); }
        .v-d .card-img { aspect-ratio: 1/.78; }
        .v-d .card-img > .ic { width: 84px; height: 84px; }

        /* ---------- Page Head & Catalog ---------- */
        .phead { padding: 48px 0 8px; }
        .phead h1 { font-size: clamp(42px, 6vw, 76px); line-height: 1.02; letter-spacing: -.02em; margin: 12px 0; }
        .phead p { color: var(--ink-2); max-width: 560px; font-size: 17px; }
        .v-a .phead { text-align: center; margin-top: 20px; border-radius: 36px; padding: 64px 24px 60px; background: radial-gradient(90% 120% at 100% 0%, rgba(255,245,245,.9) 0%, rgba(255,245,245,0) 55%), linear-gradient(135deg, #F2D4CE 0%, #D9B5BD 100%); position: relative; overflow: hidden; }
        .v-a .phead::before { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; border: 1px dotted rgba(74,74,74,.3); left: -90px; top: -170px; }
        .v-a .phead p { margin: 0 auto; color: #5b4f50; }
        .v-d .phead { text-align: center; padding: 64px 0 8px; }
        .v-d .phead p { margin: 0 auto; }
        .v-d .phead h1 { font-size: clamp(46px, 7vw, 92px); letter-spacing: -.03em; }

        .res-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin: 40px 0 22px; }
        .res-bar .count { font-size: 30px; }
        .res-bar .field { width: auto; min-width: 170px; }
        .pager { display: flex; justify-content: center; gap: 8px; margin-top: 44px; }
        .pager button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--rose); background: transparent; cursor: pointer; font-weight: 500; }
        .pager button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
        .pager button:hover:not(.on) { background: var(--blush); }

        /* ---------- Terms & Timeline ---------- */
        .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 28px; padding: 10px 36px; }
        .acc details { border-bottom: 1px dotted var(--rose-deep); }
        .acc details:last-child { border-bottom: 0; }
        .acc summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 24px 4px; cursor: pointer; font-weight: 600; font-size: 18px; }
        .acc summary::-webkit-details-marker { display: none; }
        .acc summary .ic { transition: transform .25s; color: var(--rose-deep); }
        .acc details[open] summary .ic { transform: rotate(45deg); }
        .acc details p { padding: 0 4px 26px; color: var(--ink-2); max-width: 680px; }

        .timeline { position: relative; max-width: 860px; margin: 56px auto 0; display: grid; gap: 26px; }
        .timeline::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; border-left: 1px dotted var(--rose-deep); }
        .tl { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; position: relative; }
        .tl .dot { position: absolute; left: 50%; top: 26px; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 18px; z-index: 1; box-shadow: 0 0 0 8px var(--bg); }
        .tl .box { background: var(--paper); border-radius: 28px; padding: 24px 28px; box-shadow: 0 24px 44px -34px rgba(120,70,85,.5); }
        .tl:nth-child(odd) .box { grid-column: 1; text-align: right; }
        .tl:nth-child(even) .box { grid-column: 2; }
        .tl h3 { font-size: 20px; font-weight: 600; }
        .tl p { color: var(--ink-2); font-size: 15px; }

        /* ---------- Team View (คง Layout และรูปภาพเดิม) ---------- */
        /* ---------- Team View (สีชมพู-ครีมโทนเดียวกับแบนเนอร์ + คง Layout รูปภาพเดิม) ---------- */
        .team-wrap {
            max-width: 1160px; margin: 36px auto 0; padding: 36px 28px 44px; border-radius: 36px;
            background: radial-gradient(90% 100% at 100% 0%, rgba(255,245,245,.9) 0%, rgba(255,245,245,0) 60%), linear-gradient(135deg, #F2D4CE 0%, #D9B5BD 100%);
            border: 1px solid var(--line); box-shadow: 0 28px 50px -34px rgba(120,70,85,.45);
        }
        .team-header {
            background: rgba(255,253,253,.88); backdrop-filter: blur(8px); border: 1px solid var(--line);
            text-align: center; padding: 18px 24px; margin-bottom: 32px; border-radius: 22px;
        }
        .team-grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; margin-bottom: 28px; }
        .team-card {
            background: var(--paper); border: 1px solid var(--line); border-radius: 26px; padding: 26px 18px;
            text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 18px 36px -24px rgba(120,70,85,.4); transition: transform .25s, box-shadow .25s, border-color .25s;
        }
        .team-card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 24px 42px -20px rgba(191,75,114,.35); }
        .team-img { margin: 0 auto 12px; object-fit: contain; }
        .team-member5 { width: 100%; max-width: 270px; }

        /* ---------- Product Detail Page ---------- */
        .card[data-detail] { cursor: pointer; }
        .fav.on { background: var(--accent); color: #fff; }
        .fav.on .ic, .icon-btn.on .ic { fill: currentColor; }
        .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rose); background: var(--paper); display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
        .icon-btn:hover { background: var(--accent-soft); color: var(--accent-d); border-color: var(--accent); }
        .icon-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
        .icon-btn.lg { width: 56px; height: 56px; flex: none; }

        .crumbs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); padding: 30px 0 18px; }
        .crumbs a { text-decoration: none; }
        .crumbs a:hover { color: var(--accent-d); }
        .crumbs b { color: var(--ink); font-weight: 600; }
        .dgrid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 28px; align-items: start; }
        .dpic-main { position: relative; aspect-ratio: 1/.88; border-radius: 32px; display: grid; place-items: center; overflow: hidden; color: var(--ink); }
        .dpic-main > .ic { width: 150px; height: 150px; stroke-width: .8; }
        .dpic-main::after { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 1px dotted rgba(74,74,74,.3); right: -120px; top: -170px; }
        .dpic-main .badge { font-size: 13px; padding: 4px 14px; }
        .dpic-main .fav { width: 44px; height: 44px; }
        .thumbs { display: flex; gap: 12px; margin-top: 14px; }
        .thumb { width: 92px; height: 72px; border-radius: 18px; border: 2px solid transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); transition: border-color .2s, transform .2s; }
        .thumb:hover { transform: translateY(-2px); }
        .thumb.on { border-color: var(--accent); }
        .thumb .ic { width: 30px; height: 30px; stroke-width: 1.2; }
        .dtypes { display: flex; justify-content: space-between; align-items: center; gap: 12px 18px; flex-wrap: wrap; margin-top: 18px; }
        .seg-t { display: inline-flex; gap: 6px; flex-wrap: wrap; }
        .seg-t span { padding: 5px 15px; border-radius: 999px; border: 1px solid var(--rose); font-size: 14px; color: var(--ink-2); }
        .seg-t span.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-d); font-weight: 600; }
        .src { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
        .src .ic { width: 16px; height: 16px; color: var(--accent); }

            .foot { grid-template-columns: 1fr; gap: 36px; }

            .br-name { font-size: 32px; }
            .band { padding: 44px 0 48px; }
            .car > .card { flex-basis: 82%; }

</head>
<body>

    <!-- ==================== MAIN APP CONTAINER (พื้นที่แสดงผลหลักของเว็บไซต์) ==================== -->
    <div id="site" class="site v-a"></div>

    <!-- ==================== LOGIN / SIGNUP MODAL (หน้าต่างเข้าสู่ระบบและสมัครสมาชิกแบบเดิม) ==================== -->

                    <div class="flex flex-col gap-1.5">

                <!-- Header -->

        /* ============================================================================
           3. HISTORY STACK & NAVIGATION (ระบบเปลี่ยนหน้า รองรับ Back / Forward และตัด Stack เมื่อกลับ Home)
           ============================================================================ */
        let currentDepth = 0;
        let resetForwardStack = false;

        // ฟังก์ชันเปลี่ยนหน้าหลักของเว็บไซต์ (รองรับทั้งชื่อหน้า 'home' และ ID 'home-view')
        function goToPage(pageInput, options = {}, addHistory = true) {
            const page = pageInput.replace('-view', '');

            // หากกลับมาหน้า home ให้ถอย Stack กลับไปจุดเริ่มต้นและตัดหน้าเก่าใน Forward Stack ทิ้ง
            if (addHistory && page === 'home') {
                if (currentDepth > 0) {
                    resetForwardStack = true;
                    history.go(-currentDepth);
                    return;
                } else {
                    history.replaceState({ page: 'home', type: -1, item: 0, depth: 0 }, '', '?page=home');
                    addHistory = false;
                }
            }

            state.p = page;
            if (options.type !== undefined) state.type = options.type;
            if (options.item !== undefined) state.item = options.item;

            if (addHistory && page !== 'home') {
                currentDepth++;
                history.pushState(
                    { page: state.p, type: state.type, item: state.item, depth: currentDepth },
                    '',
                    `?page=${state.p}`
                );
            }

            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Alias เพื่อความเข้ากันได้กับโค้ดเดิมที่เรียก switchView('home-view')
        function switchView(viewId, addHistory = true) {
            goToPage(viewId, {}, addHistory);
        }

        // ดักจับการกดปุ่ม ย้อนกลับ (Backward) และ ไปข้างหน้า (Forward) ของเบราว์เซอร์
        window.addEventListener('popstate', (event) => {
            const st = event.state || { page: 'home', type: -1, item: 0, depth: 0 };
            currentDepth = st.depth || 0;
            state.p = st.page || 'home';
            state.type = st.type !== undefined ? st.type : -1;
            state.item = st.item !== undefined ? st.item : 0;

            render();

            // ตัดประวัติหน้าถัดไป (Forward Stack) ทิ้งเมื่อถอยกลับมาหน้า home
            if (resetForwardStack && state.p === 'home') {
                resetForwardStack = false;
                history.pushState({ page: 'home', type: -1, item: 0, depth: 0 }, '', '?page=home');
            }
        });

        // ตั้งค่าหน้าเริ่มต้นเวลาโหลดเว็บหรือกด Refresh
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const initialPage = params.get('page') || 'home';
            currentDepth = 0;
            history.replaceState({ page: initialPage, type: state.type, item: state.item, depth: 0 }, '', `?page=${initialPage}`);
            state.p = initialPage;
            render();
        });

                        <a href="#" onclick="event.preventDefault()">${ic('chat')}LINE @lekhafong</a>
                        <a class="addr" href="#" onclick="event.preventDefault()">${ic('pin')}<span>LekhaFong Studio<br>ซอยสุขุมวิท 55 เขตวัฒนา กรุงเทพฯ 10110</span></a>
                        <p>ทุกวัน 09:00 – 19:00</p>
                        <a class="maplink" href="#" onclick="event.preventDefault()">ดูแผนที่${ic('arrow')}</a>
                    </div>
                </div>
                <div class="wrap copy">
                    <hr class="dots">
                    <small>© 2026 LekhaFong. All rights reserved.</small>
                </div>
            </footer>`;
        }

        /* ============================================================================
           5. INTERACTIVE HANDLERS (ฟังก์ชันจัดการ Login, Search, Admin, Carousel)
           ============================================================================ */

        // เปิด / ปิด Modal (ไม่เก็บลง History Stack)
        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        // สลับแท็บ Log in / Sign up ภายใน Modal เดิม
        function switchAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-signup').classList.toggle('hidden', isLogin);

            const box = document.getElementById('auth-box');
            box.classList.toggle('max-w-md', isLogin);
            box.classList.toggle('max-w-2xl', !isLogin);

            [['tab-login', isLogin], ['tab-signup', !isLogin]].forEach(([id, active]) => {
                const el = document.getElementById(id);
                el.setAttribute('aria-selected', active);
                el.className = `relative pb-3 text-base font-semibold transition-colors ${active ? 'text-[#4A4A4A]' : 'text-[#7A6E70] hover:text-[#4A4A4A]'}`;
                const bar = el.querySelector('.auth-tab-bar');
                if (bar) bar.classList.toggle('opacity-0', !active);
            });
        }

        // จัดการการกด Submit ฟอร์ม Login
        async function handleLoginSubmit(event) {
            event.preventDefault();
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const email = emailInput ? emailInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value : '';

            // เรียก API Placeholder สำหรับเชื่อมต่อ MySQL
            await apiLoginUser(email, password);

            // ทำงานร่วมกับ simulateLogin เดิม
            simulateLogin(email);
        }

        // จำลองการล็อกอิน (รองรับทั้งโหมด Admin และผู้ใช้ทั่วไป)
        function simulateLogin(emailValue = '') {
            const email = emailValue || (document.getElementById('login-email')?.value || '');
            if (email.toLowerCase().includes('admin') || email === '') {
                state.isAdmin = true;
                state.currentUser = 'Admin';
                toggleModal('login-modal');
                goToPage('admin');
            } else {
                state.isAdmin = false;
                state.currentUser = email.split('@')[0];
                toggleModal('login-modal');
                render();
            }
        }

        // ออกจากระบบแอดมินและกลับหน้าแรกพร้อมล้าง Stack
        function logoutAdmin() {
            state.isAdmin = false;
            state.currentUser = null;
            goToPage('home');
        }

        // จัดการการกด Submit ฟอร์ม Sign up
        async function handleSignupSubmit(event) {
            event.preventDefault();
            const formData = {
                first_name: document.getElementById('su-first').value,
                last_name: document.getElementById('su-last').value,
                email: document.getElementById('su-email').value,
                phone: document.getElementById('su-phone').value,
                address: document.getElementById('su-address').value
            };
            await apiRegisterUser(formData);
        }

        // ฟังก์ชันค้นหาหลักและตัวกรองขั้นสูง
        async function submitSearchBar(event) {
            event.preventDefault();
            state.filters.keyword = document.getElementById('sb-keyword')?.value || '';
            state.filters.pickupDate = document.getElementById('sb-pickup')?.value || '';
            state.filters.returnDate = document.getElementById('sb-return')?.value || '';
            await apiFetchProducts(state.filters);
            goToPage('search');
        }

        async function applyAdvanceSearch() {
            state.filters.maxPrice = +(document.getElementById('adv-max-price')?.value || 3000);
            state.filters.brand = document.getElementById('adv-brand')?.value || 'ทุกยี่ห้อ';
            await apiFetchProducts(state.filters);
            goToPage('search');
        }

        function resetAdvanceFilters() {
            state.filters = { keyword: '', pickupDate: '', returnDate: '', maxPrice: 3000, brand: 'ทุกยี่ห้อ' };
            state.type = -1;
            render();
        }

        // ฟังก์ชันกดปุ่ม "เช่าเลย" ในหน้ารายละเอียดสินค้า
        async function handleRentNow() {
            const product = P[state.item];
            const pickupMethod = document.querySelector('input[name="pk"]:checked')?.value || 'store';
            const pickupDate = document.getElementById('detail-pickup')?.value || 'ยังไม่ระบุ';
            const returnDate = document.getElementById('detail-return')?.value || 'ยังไม่ระบุ';

            await apiCreateBooking({
                productId: product.id,
                productName: product.n,
                pickupMethod,
                pickupDate,
                returnDate,
                dailyPrice: product.p
            });
        }

        // ---------------- ฟังก์ชันระบบย่อยในหน้า Admin ----------------
        function openAdminTab(tabId) {
            document.querySelectorAll('.admin-tab-content').forEach(tab => {
                tab.classList.remove('block');
                tab.classList.add('hidden');
            });
            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                btn.classList.remove('bg-[#D9B5BD]', 'font-bold', 'text-[#4A4A4A]', 'shadow-sm');
                btn.classList.add('text-[#6F6262]', 'hover:bg-[#F2D4CE]/50');
            });

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(tabId).classList.add('block');

            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('bg-[#D9B5BD]', 'font-bold', 'text-[#4A4A4A]', 'shadow-sm');
            activeBtn.classList.remove('text-[#6F6262]', 'hover:bg-[#F2D4CE]/50');
        }

        function toggleUserDetails(username, email) {
            document.getElementById('user-list-view').classList.add('hidden');
            document.getElementById('user-detail-view').classList.remove('hidden');
            document.getElementById('dt-user').innerText = username;
            document.getElementById('dt-email').innerText = email;
        }

        function backToUserList() {
            document.getElementById('user-detail-view').classList.add('hidden');
            document.getElementById('user-list-view').classList.remove('hidden');
        }

        function toggleProductDetails(id, name, stock, price = '900') {
            document.getElementById('product-list-view').classList.add('hidden');
            document.getElementById('product-add-view').classList.add('hidden');
            document.getElementById('product-detail-view').classList.remove('hidden');

            document.getElementById('pd-id').value = id;
            document.getElementById('pd-name').value = name;
            document.getElementById('pd-stock').value = stock;
            document.getElementById('pd-price').value = price;
        }

        function showAddProduct() {
            document.getElementById('product-list-view').classList.add('hidden');
            document.getElementById('product-detail-view').classList.add('hidden');
            document.getElementById('product-add-view').classList.remove('hidden');
        }

        function backToProductList() {
            document.getElementById('product-detail-view').classList.add('hidden');
            document.getElementById('product-add-view').classList.add('hidden');
            document.getElementById('product-list-view').classList.remove('hidden');
        }

        /* ============================================================================
           6. RENDER ENGINE & GLOBAL EVENT LISTENERS
           ============================================================================ */
        function initCarousels() {
            document.querySelectorAll('[data-carousel]').forEach(car => {
                const navEl = car.parentElement.querySelector('[data-car-nav]');
                if (!navEl) return;
                const prev = navEl.querySelector('[data-car="-1"]');
                const next = navEl.querySelector('[data-car="1"]');
                const sync = () => {
                    navEl.hidden = car.scrollWidth <= car.clientWidth + 2;
                    prev.disabled = car.scrollLeft <= 2;
                    next.disabled = car.scrollLeft + car.clientWidth >= car.scrollWidth - 2;
                };
                car.addEventListener('scroll', sync, { passive: true });
                new ResizeObserver(sync).observe(car);
                sync();
            });
        }

        function render() {
            const pages = { home, search: catalog, terms, team, detail, admin };
            const currentRenderer = pages[state.p] || home;
            const site = $('#site');
            site.className = 'site v-' + (PAGE_VARIANT[state.p] || 'a');
            site.innerHTML = nav() + currentRenderer() + footer();
            initCarousels();
        }

        // จัดการคลิกทั้งหมดบนหน้าเว็บผ่าน Event Delegation
        document.addEventListener('click', e => {
            const t = e.target;
            if (t.closest('a[href="#"]')) e.preventDefault();

            // เปลี่ยนหน้าจากลิงก์เมนู / การ์ดแบรนด์ / Breadcrumb
            const go = t.closest('[data-go]');
            if (go) {
                const targetPage = go.dataset.go;
                const targetType = targetPage === 'search'
                    ? (go.dataset.type === undefined ? -1 : +go.dataset.type)
                    : state.type;
                goToPage(targetPage, { type: targetType });
                return;
            }

            // กรองหมวดหมู่ในหน้า Search
            const tc = t.closest('[data-type-chip]');
            if (tc) {
                state.type = +tc.dataset.typeChip;
                render();
                return;
            }

            // เลื่อน Carousel สินค้าแนะนำ
            const cb = t.closest('[data-car]');
            if (cb) {
                const el = cb.closest('section').querySelector('[data-carousel]');
                el.scrollBy({ left: +cb.dataset.car * el.clientWidth * 0.9, behavior: 'smooth' });
                return;
            }

            // เปลี่ยนรูปย่อยในหน้า Detail
            const th = t.closest('[data-thumb]');
            if (th) {
                th.parentElement.querySelectorAll('.thumb').forEach(x => x.classList.toggle('on', x === th));
                $('#dmain').className = 'dpic-main ' + th.dataset.thumb;
                return;
            }

            // คลิกการ์ดสินค้าเพื่อเปิดหน้ารายละเอียด
            const det = t.closest('[data-detail]');
            if (det && !t.closest('.fav')) {
                const itemIndex = +det.dataset.detail;
                apiFetchProductDetail(P[itemIndex]?.id);
                goToPage('detail', { item: itemIndex });
                return;
            }

            // สลับสไลด์แบนเนอร์หน้าแรก
            const sl = t.closest('[data-slide]');
            if (sl) {
                state.slide = +sl.dataset.slide;
                render();
                return;
            }

            // เปิด/ปิดแผงค้นหาขั้นสูง (ไม่เก็บลง History Stack)
            const adv = t.closest('[data-adv]');
            if (adv) {
                const panel = adv.closest('.searchwrap').querySelector('.adv-panel');
                panel.hidden = !panel.hidden;
                adv.setAttribute('aria-expanded', String(!panel.hidden));
                adv.classList.toggle('open', !panel.hidden);
                return;
            }

            // เลือก Chip หมวดหมู่ใน Advance Search
            const chip = t.closest('[data-chip]');
            if (chip) chip.classList.toggle('on');
        });

        // อัปเดตตัวเลขราคาเมื่อเลื่อน Slider ใน Advance Search
        document.addEventListener('input', e => {
            if (e.target.type === 'range') {
                e.target.parentElement.querySelector('.range-val').textContent = '฿' + (+e.target.value).toLocaleString('en-US');
            }
        });
    </script>
</body>
